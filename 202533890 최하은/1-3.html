<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        li {
            list-style-type: none;
        }

        .clear {
            clear: both;
        }

        body {
            background-color: rgb(255, 248, 224);
        }

        #header {
            background-color: black;
            width: 100%;
            height: 180px;
            text-align: center;
            padding-top: 10px;
        }

        img#center {
            width: 120px;
            height: 100px;
            margin: 10px 100px;
        }

        #menu {
            margin-top: 10px;
        }

        #menu li {
            display: inline;
            padding: 0 30px;
            font-size: 20px;
            color: aliceblue;
        }

        #menu a:link {
            color: white;
            text-decoration: none;
        }

        #menu a:hover {
            color: rgb(255, 143, 162);
        }

        #menu a:visited {
            color: white;
        }

        #home img {
            width: 30px;
            height: 30px;
            vertical-align: middle;
        }

        h3#home {
            margin: 50px 0 20px 100px;
        }

        aside {
            width: 40%;
            float: left;
            padding: 50px;
        }

        main {
            width: 60%;
            float: left;
            padding: 50px;
        }

        #aside img {
            width: 50%;
            height: 300px;
            float: left;
        }

        #section1 {
            background-color: white;
            width: 100%;
            padding: 20px;
            border-radius: 10px;
        }

        .info li {
            margin: 15px 0;
        }

        .info img {
            width: 20px;
            height: 20px;
            vertical-align: middle;
            margin-right: 10px;
        }

        #section2 {
            background-color: white;
            width: 100%;
            padding: 20px;
            margin-top: 20px;
            border-radius: 30px;
        }

        #section2 a {
            color: black;
        }

        #review {
            background-color: white;
            width: 100%;
            padding: 20px;
            margin-top: 20px;
            border-radius: 5px;
        }

        .left {
            width: 50%;
            float: left;
        }

        .right {
            width: 50%;
            float: left;
            border-left: 1px solid lightgray;
            padding-left: 20px;
        }

        .left h2 {
            color: red;
        }

        .right h2 {
            color: green;
        }


        

        footer {
            padding: 30px 50px;
        }

        #footer img {
            width: 50px;
            height: 50px;
            float: left;
            margin-right: 10px;
        }

        @media only screen and (max-width: 620px) {

            #header {
                height: auto;
                padding: 10px;
            }

            #menu {
                margin-top: 0;
            }

            #menu li {
                display: block;
                padding: 10px;
                font-size: 18px;
            }

            img#center {
                width: 100px;
                height: 80px;
                margin: 10px auto;
                display: block;
            }

            h3#home {
                margin: 30px 20px;
            }

            aside,
            main {
                width: 100%;
                float: none;
                padding: 20px;
            }

            #aside img {
                width: 100%;
                height: auto;
                float: none;
            }

            .left,
            .right {
                width: 100%;
                float: none;
            }

            .right {
                border-left: none;
                border-top: 1px solid lightgray;
                padding-left: 0;
                padding-top: 15px;
                margin-top: 15px;
            }
        }
    </style>
</head>

<body>

    <body>

        <header>

        <div class="clear"></div>

        <footer id="footer">

    </body>
</body>

</html>
